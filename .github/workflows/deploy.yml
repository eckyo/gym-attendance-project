name: Deploy to Railway

on:
  push:
    branches: [main, staging]

jobs:
  deploy:
    name: Deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway Production Deploy
        if: github.ref_name == 'main'
        run: |
          curl -fsSL -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceRedeploy(serviceId: \"e88235cd-e8e9-45cc-b6cc-62a9a1432e3e\", environmentId: \"a63ed619-5b12-469c-9d28-79a7e86ba02a\") }"}' \
            | tee /dev/stderr | grep -q '"serviceInstanceRedeploy":true'

      - name: Trigger Railway Staging Deploy
        if: github.ref_name == 'staging'
        run: |
          curl -fsSL -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceRedeploy(serviceId: \"e88235cd-e8e9-45cc-b6cc-62a9a1432e3e\", environmentId: \"febea53c-fdcf-4b39-b28a-09b5a5eaa029\") }"}' \
            | tee /dev/stderr | grep -q '"serviceInstanceRedeploy":true'
